<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | AgriSmart</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="css/common.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: var(--font-body, "Inter", sans-serif);
            background: radial-gradient(circle at 10% 10%, rgba(34, 197, 94, 0.08) 0%, transparent 40%),
                        radial-gradient(circle at 90% 90%, rgba(20, 83, 45, 0.06) 0%, transparent 40%),
                        #f8faf8;
            color: var(--text-body, #1f2937);
        }

        .auth-page {
            min-height: calc(100vh - 72px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .auth-card {
            width: 100%;
            max-width: 480px;
            background: #ffffff;
            padding: 40px;
            border-radius: 24px;
            border: 1px solid #e2ece3;
            box-shadow: 0 20px 45px -10px rgba(20, 83, 45, 0.12);
        }

        .auth-icon {
            width: 58px;
            height: 58px;
            margin: 0 auto 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #dcfce7;
            border: 1px solid #bbf7d0;
            border-radius: 16px;
            font-size: 28px;
            box-shadow: 0 4px 12px rgba(22, 163, 74, 0.15);
        }

        .auth-card h1 {
            margin: 0;
            text-align: center;
            color: #0f172a;
            font-family: var(--font-heading, "Plus Jakarta Sans", sans-serif);
            font-size: 26px;
            font-weight: 800;
        }

        .auth-subtitle {
            margin: 8px 0 24px;
            text-align: center;
            color: #64748b;
            font-size: 13px;
            line-height: 1.6;
        }

        .method-title {
            margin-bottom: 10px;
            color: #334155;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .method-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 22px;
        }

        .method-option {
            position: relative;
        }

        .method-option input {
            position: absolute;
            opacity: 0;
            pointer-events: none;
        }

        .method-option label {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            height: 46px;
            border: 1.5px solid #cbd5e1;
            border-radius: 12px;
            background: #ffffff;
            color: #475569;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .method-option label:hover {
            border-color: #86efac;
            background: #f0fdf4;
        }

        .method-option input:checked + label {
            border-color: #16a34a;
            background: #f0fdf4;
            color: #15803d;
            box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.15);
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            color: #334155;
            font-size: 13px;
            font-weight: 600;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            height: 48px;
            padding: 0 16px;
            border: 1.5px solid #cbd5e1;
            border-radius: 12px;
            outline: none;
            font-size: 14px;
            font-family: inherit;
            color: #1e293b;
            background: #ffffff;
            transition: all 0.2s ease;
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: #16a34a;
            box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.15);
        }

        .auth-button {
            width: 100%;
            height: 48px;
            margin-top: 8px;
            border: none;
            border-radius: 12px;
            background: #16a34a;
            color: #ffffff;
            font-family: inherit;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(22, 163, 74, 0.25);
        }

        .auth-button:hover {
            background: #15803d;
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(22, 163, 74, 0.35);
        }

        .auth-button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .message {
            display: none;
            margin-bottom: 18px;
            padding: 12px 14px;
            border-radius: 10px;
            font-size: 13px;
            line-height: 1.5;
        }

        .message.error {
            display: block;
            color: #991b1b;
            background: #fef2f2;
            border: 1px solid #fecaca;
        }

        .message.success {
            display: block;
            color: #166534;
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
        }

        .auth-footer {
            margin-top: 24px;
            text-align: center;
            color: #64748b;
            font-size: 13px;
        }

        .auth-footer a {
            color: #16a34a;
            font-weight: 700;
            text-decoration: none;
        }

        .auth-footer a:hover {
            text-decoration: underline;
        }

        .back-home {
            margin-top: 16px;
            text-align: center;
        }

        .back-home a {
            color: #64748b;
            font-size: 13px;
            text-decoration: none;
        }

        .back-home a:hover {
            color: #16a34a;
        }

        .hidden {
            display: none;
        }

        @media (max-width: 600px) {
            .auth-card {
                padding: 28px 20px;
            }

            .method-options {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<header class="navbar">

    <a href="index.html" class="logo">
        <span class="logo-icon">🌱</span>
        <span data-i18n="brand_name">AgriSmart</span>
    </a>

    <button class="mobile-menu-toggle" id="mobileMenuToggle" aria-label="Toggle navigation">☰</button>

    <nav class="nav-links">
        <a href="index.html" data-i18n="home">Home</a>
    </nav>

    <div class="nav-actions" style="display:flex; align-items:center; gap:10px;">
        <button
            class="farmer-btn"
            onclick="window.location.href='login.html'"
        >
            Farmer
        </button>
        <select id="lang-select">
            <option value="en" data-i18n="english">English</option>
            <option value="mr" data-i18n="marathi">मराठी</option>
            <option value="hi" data-i18n="hindi">हिन्दी</option>
        </select>
    </div>

</header>

<main class="auth-page">

    <div class="auth-card">

        <div class="auth-icon">
            🌱
        </div>

        <h1>Create Account</h1>

        <p class="auth-subtitle">
            Choose how you want to create your AgriSmart account.
        </p>

        <div id="message" class="message"></div>

        <!-- AUTH METHOD -->

        <div class="method-title">
            How would you like to register?
        </div>

        <div class="method-options">

            <div class="method-option">

                <input
                    type="radio"
                    id="phoneMethod"
                    name="authMethod"
                    value="phone"
                    checked>

                <label for="phoneMethod">
                    📱 Phone Number
                </label>

            </div>

            <div class="method-option">

                <input
                    type="radio"
                    id="emailMethod"
                    name="authMethod"
                    value="email">

                <label for="emailMethod">
                    📧 Email
                </label>

            </div>

        </div>

        <form id="registerForm">

            <!-- FULL NAME -->

            <div class="form-group">

                <label for="fullName">
                    Full Name
                </label>

                <input
                    type="text"
                    id="fullName"
                    name="full_name"
                    placeholder="Enter your full name"
                    autocomplete="name"
                    required>

            </div>

            <!-- PHONE FIELDS -->

            <div id="phoneFields">

                <div class="form-group">

                    <label for="mobileNumber">
                        Mobile Number
                    </label>

                    <input
                        type="tel"
                        id="mobileNumber"
                        name="mobile_number"
                        placeholder="Enter 10-digit mobile number"
                        maxlength="10"
                        inputmode="numeric"
                        autocomplete="tel">

                </div>

            </div>

            <!-- EMAIL FIELDS -->

            <div id="emailFields" class="hidden">

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        autocomplete="email">

                </div>

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter password"
                        autocomplete="new-password">

                </div>

                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirm_password"
                        placeholder="Re-enter password"
                        autocomplete="new-password">

                </div>

            </div>

            <!-- LANGUAGE -->

            <div class="form-group">

                <label for="language">
                    Preferred Language
                </label>

                <select
                    id="language"
                    name="preferred_language">

                    <option value="English">
                        English
                    </option>

                    <option value="Marathi">
                        मराठी
                    </option>

                    <option value="Hindi">
                        हिंदी
                    </option>

                </select>

            </div>

            <button
                type="submit"
                class="auth-button"
                id="registerButton">

                Create Account

            </button>

        </form>

        <div class="auth-footer">

            Already have an account?

            <a href="login.html">
                Login
            </a>

        </div>

        <div class="back-home">

            <a href="index.html">
                ← Back to Home
            </a>

        </div>

    </div>

</main>


<script src="js/i18n.js"></script>
<script src="js/register.js"></script>
<script src="js/mobile-nav.js"></script>

</body>

</html>
