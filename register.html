<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | AgriSmart</title>

    <link rel="stylesheet" href="style.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #f4faf3;
        }

        .auth-page {
            min-height: calc(100vh - 72px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .auth-card {
            width: 100%;
            max-width: 480px;
            background: #ffffff;
            padding: 40px;
            border-radius: 22px;
            border: 1px solid #dce8dc;
            box-shadow: 0 15px 40px rgba(22, 101, 52, 0.10);
        }

        .auth-icon {
            width: 65px;
            height: 65px;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #dcfce7;
            border: 1px solid #bbf7d0;
            border-radius: 18px;
            font-size: 30px;
        }

        .auth-card h1 {
            margin: 0;
            text-align: center;
            color: #14532d;
            font-size: 30px;
        }

        .auth-subtitle {
            margin: 10px 0 30px;
            text-align: center;
            color: #718071;
            font-size: 14px;
            line-height: 1.6;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #304936;
            font-size: 13px;
            font-weight: 700;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            height: 50px;
            padding: 0 15px;
            border: 1px solid #d4ded5;
            border-radius: 11px;
            outline: none;
            font-size: 14px;
            color: #334155;
            background: #ffffff;
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: #55a94e;
            box-shadow: 0 0 0 4px rgba(85, 169, 78, 0.10);
        }

        .auth-button {
            width: 100%;
            height: 50px;
            margin-top: 8px;
            border: none;
            border-radius: 11px;
            background: linear-gradient(135deg, #18753d, #42a851);
            color: #ffffff;
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
            transition: 0.2s ease;
        }

        .auth-button:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 20px rgba(35, 120, 60, 0.22);
        }

        .auth-button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .message {
            display: none;
            margin-bottom: 18px;
            padding: 12px 14px;
            border-radius: 10px;
            font-size: 13px;
            line-height: 1.5;
        }

        .message.error {
            display: block;
            color: #991b1b;
            background: #fef2f2;
            border: 1px solid #fecaca;
        }

        .message.success {
            display: block;
            color: #166534;
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
        }

        .mobile-info {
            margin-top: -8px;
            margin-bottom: 18px;
            color: #64748b;
            font-size: 12px;
            line-height: 1.5;
        }

        .auth-footer {
            margin-top: 25px;
            text-align: center;
            color: #718071;
            font-size: 13px;
        }

        .auth-footer a {
            color: #15803d;
            font-weight: 700;
            text-decoration: none;
        }

        .auth-footer a:hover {
            text-decoration: underline;
        }

        .back-home {
            margin-top: 18px;
            text-align: center;
        }

        .back-home a {
            color: #64748b;
            font-size: 12px;
            text-decoration: none;
        }

        .back-home a:hover {
            color: #15803d;
        }

        @media (max-width: 600px) {
            .auth-card {
                padding: 30px 22px;
            }
        }
    </style>
</head>

<body>

    <!-- NAVBAR -->
    <header class="navbar">

        <div class="logo">
            <span class="logo-icon">🌱</span>
            <span>AgriSmart</span>
        </div>

        <nav class="nav-links">
            <a href="index.html">Home</a>
        </nav>

        <button class="farmer-btn" onclick="window.location.href='login.html'">
            Farmer
        </button>

    </header>


    <!-- REGISTER -->
    <main class="auth-page">

        <div class="auth-card">

            <div class="auth-icon">
                🌱
            </div>

            <h1>Create Account</h1>

            <p class="auth-subtitle">
                Create your AgriSmart farmer account using your mobile number.
            </p>

            <div id="message" class="message"></div>

            <form id="registerForm">

                <!-- FULL NAME -->
                <div class="form-group">

                    <label for="fullName">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="fullName"
                        name="full_name"
                        placeholder="Enter your full name"
                        autocomplete="name"
                        required
                    >

                </div>


                <!-- MOBILE NUMBER -->
                <div class="form-group">

                    <label for="mobileNumber">
                        Mobile Number
                    </label>

                    <input
                        type="tel"
                        id="mobileNumber"
                        name="mobile_number"
                        placeholder="Enter 10-digit mobile number"
                        maxlength="10"
                        inputmode="numeric"
                        autocomplete="tel"
                        required
                    >

                </div>

                <p class="mobile-info">
                    Your mobile number will be used for secure OTP-based login.
                </p>


                <!-- LANGUAGE -->
                <div class="form-group">

                    <label for="language">
                        Preferred Language
                    </label>

                    <select
                        id="language"
                        name="preferred_language"
                    >

                        <option value="English">
                            English
                        </option>

                        <option value="Marathi">
                            मराठी
                        </option>

                        <option value="Hindi">
                            हिंदी
                        </option>

                    </select>

                </div>


                <!-- REGISTER BUTTON -->
                <button
                    type="submit"
                    class="auth-button"
                    id="registerButton"
                >
                    Create Account
                </button>

            </form>


            <div class="auth-footer">

                Already have an account?

                <a href="login.html">
                    Login
                </a>

            </div>


            <div class="back-home">

                <a href="index.html">
                    ← Back to Home
                </a>

            </div>

        </div>

    </main>


    <script src="js/register.js"></script>

</body>

</html>
