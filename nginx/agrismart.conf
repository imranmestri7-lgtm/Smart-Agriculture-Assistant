# =============================================================================
# AgriSmart Production Nginx Reverse Proxy Configuration
# =============================================================================

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=iot_limit:10m rate=60r/m;

# HTTP -> HTTPS Redirect (uncomment once SSL certificate is active)
# server {
#     listen 80;
#     server_name agrismart.yourdomain.com;
#     return 301 https://$host$request_uri;
# }

server {
    listen 80;
    # listen 443 ssl http2;
    server_name localhost agrismart.yourdomain.com;

    # SSL Certificate Paths (Let's Encrypt Certbot)
    # ssl_certificate /etc/letsencrypt/live/agrismart.yourdomain.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/agrismart.yourdomain.com/privkey.pem;
    # ssl_protocols TLSv1.2 TLSv1.3;
    # ssl_ciphers HIGH:!aNULL:!MD5;
    # ssl_prefer_server_ciphers on;

    # Client body limit (16MB matches MAX_CONTENT_LENGTH in Flask)
    client_max_body_size 16M;

    # Root directory for static frontend files
    root /var/www/agrismart;
    index index.html;

    # Defensive Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # 1. PWA Service Worker (MUST NOT BE CACHED)
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Service-Worker-Allowed "/" always;
        proxy_pass http://web:5000/sw.js;
    }

    # 2. PWA Manifest & Offline Page
    location = /manifest.json {
        add_header Cache-Control "public, max-age=3600" always;
        proxy_pass http://web:5000/manifest.json;
    }

    location = /offline.html {
        proxy_pass http://web:5000/offline.html;
    }

    # 3. Static Assets (CSS, JS, Images, Icons)
    location ~* \.(css|js|png|jpg|jpeg|svg|ico|webp|woff2|woff|ttf)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform" always;
        try_files $uri @backend;
    }

    # 4. Auth Endpoints with Rate Limiting
    location /api/auth/ {
        limit_req zone=auth_limit burst=5 nodelay;
        proxy_pass http://web:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 5. IoT Telemetry Ingestion with Rate Limiting
    location ~ ^/api/iot/(ingest|telemetry/ingest)$ {
        limit_req zone=iot_limit burst=10 nodelay;
        proxy_pass http://web:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 6. General API & Dynamic Application Routing
    location / {
        try_files $uri $uri.html @backend;
    }

    location @backend {
        proxy_pass http://web:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # Block access to hidden files and backend code directly via Nginx
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ^~ /backend/ {
        deny all;
    }
}
