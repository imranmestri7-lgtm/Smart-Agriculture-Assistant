<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | AgriSmart</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="css/common.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: var(--font-body, "Inter", sans-serif);
            background: radial-gradient(circle at 10% 10%, rgba(34, 197, 94, 0.08) 0%, transparent 40%),
                        radial-gradient(circle at 90% 90%, rgba(20, 83, 45, 0.06) 0%, transparent 40%),
                        #f8faf8;
            display: flex;
            flex-direction: column;
            color: var(--text-body, #1f2937);
        }

        .auth-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px 16px 48px;
            width: 100%;
        }

        /* Main Card */
        .auth-container {
            width: 100%;
            max-width: 500px;
            background: #ffffff;
            border-radius: 24px;
            padding: 36px 40px;
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--border-subtle);
            margin: 0 auto;
        }

        .auth-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 28px;
            padding-bottom: 20px;
            border-bottom: 1px solid #edf2ee;
        }

        .brand-section {
            display: flex;
            align-items: center;
            gap: 12px;
            text-align: left;
        }

        .brand-icon {
            font-size: 32px;
            line-height: 1;
            margin-bottom: 0;
        }

        .brand-name {
            margin: 0;
            color: #15803d;
            font-family: var(--font-heading, "Plus Jakarta Sans", sans-serif);
            font-size: 26px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .brand-description {
            text-align: right;
            color: #64748b;
            font-size: 13px;
            font-weight: 600;
            line-height: 1.3;
        }

        /* Login Title */
        .login-title {
            margin: 0 0 20px;
            color: #0f172a;
            font-family: var(--font-heading, "Plus Jakarta Sans", sans-serif);
            font-size: 20px;
            font-weight: 800;
        }

        /* Login Method */
        .method-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 24px;
        }

        .method-option {
            min-height: 72px;
            border: 1.5px solid #e2e8f0;
            border-radius: 14px;
            background: #ffffff;
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            gap: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            padding: 10px;
        }

        .method-option:hover {
            border-color: #86efac;
            background: #f0fdf4;
        }

        .method-option.active {
            border-color: #16a34a;
            background: #f0fdf4;
            box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.15);
        }

        .method-option input {
            display: none;
        }

        .method-icon {
            font-size: 22px;
            margin-bottom: 0;
        }

        .method-text {
            color: #1e293b;
            font-size: 14px;
            font-weight: 700;
        }

        /* Form */
        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            color: #334155;
            font-size: 13px;
            font-weight: 600;
        }

        .form-group input {
            width: 100%;
            height: 48px;
            padding: 0 16px;
            border: 1.5px solid #cbd5e1;
            border-radius: 12px;
            outline: none;
            font-size: 14px;
            font-family: inherit;
            color: #1e293b;
            background: #ffffff;
            transition: all 0.2s ease;
        }

        .form-group input:focus {
            border-color: #16a34a;
            box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.15);
        }

        .form-group input::placeholder {
            color: #94a3b8;
        }

        /* OTP Row */
        .otp-row {
            display: grid;
            grid-template-columns: 1fr 140px;
            gap: 12px;
            margin-bottom: 18px;
        }

        .otp-row input {
            height: 48px;
            padding: 0 16px;
            border: 1.5px solid #cbd5e1;
            border-radius: 12px;
            font-size: 14px;
            font-family: inherit;
            outline: none;
            transition: all 0.2s ease;
        }

        .otp-row input:focus {
            border-color: #16a34a;
            box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.15);
        }

        /* Buttons */
        .send-otp-btn {
            height: 48px;
            border: none;
            border-radius: 12px;
            background: #16a34a;
            color: white;
            font-family: inherit;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
            padding: 0 14px;
        }

        .send-otp-btn:hover {
            background: #15803d;
        }

        .send-otp-btn:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }

        .login-btn {
            width: 100%;
            height: 48px;
            margin-top: 10px;
            border: none;
            border-radius: 12px;
            background: #16a34a;
            color: white;
            font-family: inherit;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(22, 163, 74, 0.25);
        }

        .login-btn:hover {
            background: #15803d;
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(22, 163, 74, 0.35);
        }

        .login-btn:disabled {
            background: #94a3b8;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* OTP Development Box */
        .development-otp {
            display: none;
            margin: 14px 0;
            padding: 12px 16px;
            border-radius: 10px;
            background: #fffbeb;
            border: 1px solid #fef3c7;
            color: #92400e;
            font-size: 13px;
        }

        .development-otp strong {
            color: #d97706;
            font-size: 15px;
        }

        /* Change Number */
        .change-number {
            display: none;
            margin: 10px auto 0;
            border: none;
            background: transparent;
            color: #16a34a;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }

        .change-number:hover {
            text-decoration: underline;
        }

        /* Messages */
        .message {
            display: none;
            margin-bottom: 18px;
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 13px;
            line-height: 1.5;
        }

        .message.success {
            display: block;
            color: #166534;
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
        }

        .message.error {
            display: block;
            color: #991b1b;
            background: #fef2f2;
            border: 1px solid #fecaca;
        }

        /* Register Link */
        .register-link {
            margin-top: 24px;
            text-align: center;
            color: #64748b;
            font-size: 13px;
        }

        .register-link a {
            color: #16a34a;
            text-decoration: none;
            font-weight: 700;
        }

        .register-link a:hover {
            text-decoration: underline;
        }

        /* Email Form */
        #emailLoginForm {
            display: none;
        }

        /* Responsive */
        @media (max-width: 600px) {
            body {
                padding: 16px 12px;
            }

            .auth-container {
                padding: 24px 20px;
                border-radius: 20px;
            }

            .auth-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 8px;
            }

            .brand-description {
                text-align: left;
            }

            .otp-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <!-- Standard Header Navbar -->
    <header class="navbar">
        <a href="index.html" class="logo">
            <span class="logo-icon">🌱</span>
            <span data-i18n="brand_name">AgriSmart</span>
        </a>
        <nav class="nav-links">
            <a href="index.html" data-i18n="home">Home</a>
        </nav>
        <div class="nav-actions">
            <select id="lang-select">
                <option value="en" data-i18n="english">English</option>
                <option value="mr" data-i18n="marathi">मराठी</option>
                <option value="hi" data-i18n="hindi">हिन्दी</option>
            </select>
        </div>
    </header>

    <div class="auth-wrapper">
        <div class="auth-container">

        <!-- Header -->
        <div class="auth-header">

            <div class="brand-section">

                <div class="brand-icon">
                    🌱
                </div>

                <h1 class="brand-name" data-i18n="brand_name">AgriSmart</h1>

            </div>

            <div class="brand-description">
                Smart Agriculture<br>
                Assistant
            </div>

        </div>


        <!-- Login Title -->
        <h2 class="login-title">
            How would you like to login?
        </h2>


        <!-- Message -->
        <div id="message" class="message"></div>


        <!-- Login Method -->
        <div class="method-options">

            <label class="method-option active" id="phoneOption">

                <input
                    type="radio"
                    name="loginMethod"
                    value="phone"
                    checked
                >

                <span class="method-icon">
                    📱
                </span>

                <span class="method-text">
                    Phone Number
                </span>

            </label>


            <label class="method-option" id="emailOption">

                <input
                    type="radio"
                    name="loginMethod"
                    value="email"
                >

                <span class="method-icon">
                    📧
                </span>

                <span class="method-text">
                    Email
                </span>

            </label>

        </div>


        <!-- ================= PHONE LOGIN ================= -->

        <form id="phoneLoginForm">

            <div class="form-group">

                <label for="mobileNumber">
                    Mobile Number
                </label>

                <input
                    type="tel"
                    id="mobileNumber"
                    placeholder="Enter 10-digit mobile number"
                    maxlength="10"
                    autocomplete="tel"
                >

            </div>


            <div class="otp-row">

                <input
                    type="text"
                    id="otp"
                    placeholder="Enter OTP"
                    maxlength="6"
                    inputmode="numeric"
                >

                <button
                    type="button"
                    id="sendOtpBtn"
                    class="send-otp-btn"
                >
                    Send OTP
                </button>

            </div>


            <div
                id="developmentOtp"
                class="development-otp"
            >
                Development OTP:
                <strong id="otpValue"></strong>
            </div>


            <button
                type="submit"
                id="verifyOtpBtn"
                class="login-btn"
            >
                Verify OTP & Login
            </button>


            <button
                type="button"
                id="changeNumberBtn"
                class="change-number"
            >
                Change mobile number
            </button>

        </form>


        <!-- ================= EMAIL LOGIN ================= -->

        <form id="emailLoginForm">

            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    autocomplete="email"
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                >

            </div>


            <button
                type="submit"
                id="emailLoginBtn"
                class="login-btn"
            >
                Login
            </button>

        </form>


        <!-- Register -->
        <div class="register-link">

            Don't have an account?

            <a href="register.html">
                Create Account
            </a>

        </div>

    </div>
    </div>


    <script src="js/i18n.js"></script>
    <script src="js/login.js"></script>
    <script src="js/mobile-nav.js"></script>

</body>

</html>
