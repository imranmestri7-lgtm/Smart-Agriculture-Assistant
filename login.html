<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | AgriSmart</title>

    <link rel="stylesheet" href="style.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #f3f8ef, #e7f0e1);

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 30px 20px;
        }

        

        /* Main Card */
        .auth-container {
            width: 100%;
            max-width: 860px;

            background: #ffffff;

            border-radius: 32px;

            padding: 70px 70px 55px;

            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.10);
        }

        /* Header */
        .auth-header {
            display: grid;
            grid-template-columns: 1fr 1fr;

            align-items: center;

            margin-bottom: 55px;
        }

        .brand-section {
            text-align: center;
        }

        .brand-icon {
            font-size: 55px;
            line-height: 1;

            margin-bottom: 8px;
        }

        .brand-name {
            margin: 0;

            color: #2e7d32;

            font-size: 58px;
            font-weight: 700;

            letter-spacing: -2px;
        }

        .brand-description {
            text-align: center;

            color: #666;

            font-size: 28px;
            font-weight: 700;

            line-height: 1.15;
        }

        /* Login Title */
        .login-title {
            margin: 0 0 25px;

            color: #292929;

            font-size: 30px;
            font-weight: 700;
        }

        /* Login Method */
        .method-options {
            display: grid;
            grid-template-columns: 1fr 1fr;

            gap: 22px;

            margin-bottom: 35px;
        }

        .method-option {
            min-height: 135px;

            border: 3px solid #dedede;

            border-radius: 22px;

            background: #ffffff;

            display: flex;
            flex-direction: column;

            align-items: center;
            justify-content: center;

            cursor: pointer;

            transition: 0.2s ease;
        }

        .method-option:hover {
            border-color: #4b8f32;
        }

        .method-option.active {
            border-color: #2e7d32;

            background: #f3f8f1;
        }

        .method-option input {
            display: none;
        }

        .method-icon {
            font-size: 32px;

            margin-bottom: 10px;
        }

        .method-text {
            color: #333;

            font-size: 22px;
            font-weight: 700;
        }

        /* Form */
        .form-group {
            margin-bottom: 22px;
        }

        .form-group label {
            display: block;

            margin-bottom: 9px;

            color: #333;

            font-size: 20px;
            font-weight: 700;
        }

        .form-group input {
            width: 100%;

            height: 68px;

            padding: 0 20px;

            border: 2px solid #d0d0d0;

            border-radius: 14px;

            outline: none;

            font-size: 20px;

            color: #333;

            background: #ffffff;
        }

        .form-group input:focus {
            border-color: #3f8731;

            box-shadow: 0 0 0 3px rgba(46, 125, 50, 0.10);
        }

        .form-group input::placeholder {
            color: #777;
        }

        /* OTP Row */
        .otp-row {
            display: grid;
            grid-template-columns: 1fr 185px;

            gap: 18px;

            margin-bottom: 18px;
        }

        .otp-row input {
            height: 68px;

            padding: 0 18px;

            border: 2px solid #d0d0d0;

            border-radius: 8px;

            font-size: 20px;

            outline: none;
        }

        .otp-row input:focus {
            border-color: #3f8731;
        }

        /* Buttons */
        .send-otp-btn {
            height: 68px;

            border: none;

            border-radius: 15px;

            background: #4f8f2e;

            color: white;

            font-size: 20px;
            font-weight: 700;

            cursor: pointer;
        }

        .send-otp-btn:hover {
            background: #3f7824;
        }

        .send-otp-btn:disabled {
            background: #aaa;

            cursor: not-allowed;
        }

        .login-btn {
            width: 100%;

            height: 70px;

            margin-top: 10px;

            border: none;

            border-radius: 15px;

            background: #2e8433;

            color: white;

            font-size: 21px;
            font-weight: 700;

            cursor: pointer;
        }

        .login-btn:hover {
            background: #256b29;
        }

        .login-btn:disabled {
            background: #999;

            cursor: not-allowed;
        }

        /* OTP Development Box */
        .development-otp {
            display: none;

            margin: 15px 0;

            padding: 14px 18px;

            border-radius: 10px;

            background: #fff8e1;

            border: 1px solid #ffe082;

            color: #795548;

            font-size: 16px;
        }

        .development-otp strong {
            color: #e65100;

            font-size: 19px;
        }

        /* Change Number */
        .change-number {
            display: none;

            margin: 12px auto 0;

            border: none;

            background: transparent;

            color: #2e7d32;

            font-size: 15px;

            cursor: pointer;
        }

        .change-number:hover {
            text-decoration: underline;
        }

        /* Messages */
        .message {
            display: none;

            margin-bottom: 20px;

            padding: 14px 18px;

            border-radius: 10px;

            font-size: 16px;
        }

        .message.success {
            display: block;

            color: #2e7d32;

            background: #e8f5e9;

            border: 1px solid #a5d6a7;
        }

        .message.error {
            display: block;

            color: #c62828;

            background: #ffebee;

            border: 1px solid #ef9a9a;
        }

        /* Register Link */
        .register-link {
            margin-top: 32px;

            text-align: center;

            color: #666;

            font-size: 18px;
        }

        .register-link a {
            color: #2e7d32;

            text-decoration: none;

            font-weight: 700;
        }

        .register-link a:hover {
            text-decoration: underline;
        }

        /* Email Form */
        #emailLoginForm {
            display: none;
        }

        /* Responsive */
        @media (max-width: 800px) {

            .auth-container {
                padding: 45px 30px;
            }

            .auth-header {
                grid-template-columns: 1fr;

                gap: 25px;

                margin-bottom: 40px;
            }

            .brand-name {
                font-size: 48px;
            }

            .brand-description {
                font-size: 24px;
            }

        }

        @media (max-width: 600px) {

            body {
                padding: 15px;
            }

            .auth-container {
                padding: 35px 22px;

                border-radius: 22px;
            }

            .brand-name {
                font-size: 42px;
            }

            .brand-description {
                font-size: 21px;
            }

            .login-title {
                font-size: 25px;
            }

            .method-options {
                grid-template-columns: 1fr;
            }

            .otp-row {
                grid-template-columns: 1fr;
            }

            .method-option {
                min-height: 110px;
            }

        }
    </style>
</head>

<body>

    <div class="auth-container">

        <!-- Header -->
        <div class="auth-header">

            <div class="brand-section">

                <div class="brand-icon">
                    🌱
                </div>

                <h1 class="brand-name">
                    AgriSmart
                </h1>

            </div>

            <div class="brand-description">
                Smart Agriculture<br>
                Assistant
            </div>

        </div>


        <!-- Login Title -->
        <h2 class="login-title">
            How would you like to login?
        </h2>


        <!-- Message -->
        <div id="message" class="message"></div>


        <!-- Login Method -->
        <div class="method-options">

            <label class="method-option active" id="phoneOption">

                <input
                    type="radio"
                    name="loginMethod"
                    value="phone"
                    checked
                >

                <span class="method-icon">
                    📱
                </span>

                <span class="method-text">
                    Phone Number
                </span>

            </label>


            <label class="method-option" id="emailOption">

                <input
                    type="radio"
                    name="loginMethod"
                    value="email"
                >

                <span class="method-icon">
                    📧
                </span>

                <span class="method-text">
                    Email
                </span>

            </label>

        </div>


        <!-- ================= PHONE LOGIN ================= -->

        <form id="phoneLoginForm">

            <div class="form-group">

                <label for="mobileNumber">
                    Mobile Number
                </label>

                <input
                    type="tel"
                    id="mobileNumber"
                    placeholder="Enter 10-digit mobile number"
                    maxlength="10"
                    autocomplete="tel"
                >

            </div>


            <div class="otp-row">

                <input
                    type="text"
                    id="otp"
                    placeholder="Enter OTP"
                    maxlength="6"
                    inputmode="numeric"
                >

                <button
                    type="button"
                    id="sendOtpBtn"
                    class="send-otp-btn"
                >
                    Send OTP
                </button>

            </div>


            <div
                id="developmentOtp"
                class="development-otp"
            >
                Development OTP:
                <strong id="otpValue"></strong>
            </div>


            <button
                type="submit"
                id="verifyOtpBtn"
                class="login-btn"
            >
                Verify OTP & Login
            </button>


            <button
                type="button"
                id="changeNumberBtn"
                class="change-number"
            >
                Change mobile number
            </button>

        </form>


        <!-- ================= EMAIL LOGIN ================= -->

        <form id="emailLoginForm">

            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    autocomplete="email"
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                >

            </div>


            <button
                type="submit"
                id="emailLoginBtn"
                class="login-btn"
            >
                Login
            </button>

        </form>


        <!-- Register -->
        <div class="register-link">

            Don't have an account?

            <a href="register.html">
                Create Account
            </a>

        </div>

    </div>


    <script src="js/login.js"></script>

</body>

</html>
