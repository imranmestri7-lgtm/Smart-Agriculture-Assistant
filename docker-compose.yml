version: '3.8'

services:
  # ---------------------------------------------------------------------------
  # 1. AgriSmart Flask Backend (Gunicorn + TensorFlow)
  # ---------------------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=agrismart_user
      - DB_PASSWORD=${DB_PASSWORD:-Agr1Sm4rt_S3cur3_P4ss}
      - DB_NAME=smart_agriculture
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - WEATHER_API_KEY=${WEATHER_API_KEY}
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID:-}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN:-}
      - TWILIO_VERIFY_SERVICE_SID=${TWILIO_VERIFY_SERVICE_SID:-}
      - FLASK_DEBUG=false
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-*}
      - MAX_CONTENT_LENGTH=16777216
    volumes:
      - uploads_data:/app/backend/uploads
    depends_on:
      db:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # 2. Production MySQL 8.0 Database
  # ---------------------------------------------------------------------------
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      - MYSQL_DATABASE=smart_agriculture
      - MYSQL_USER=agrismart_user
      - MYSQL_PASSWORD=${DB_PASSWORD:-Agr1Sm4rt_S3cur3_P4ss}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-Root_S3cur3_P4ss_2026}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "agrismart_user", "-p${DB_PASSWORD:-Agr1Sm4rt_S3cur3_P4ss}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ---------------------------------------------------------------------------
  # 3. Nginx Reverse Proxy & Static Asset Caching
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/agrismart.conf:/etc/nginx/conf.d/default.conf:ro
      - .:/var/www/agrismart:ro
      - uploads_data:/var/www/agrismart/backend/uploads:ro
      - certs_data:/etc/letsencrypt:ro
    depends_on:
      - web

volumes:
  mysql_data:
    name: agrismart_mysql_data
  uploads_data:
    name: agrismart_uploads_data
  certs_data:
    name: agrismart_ssl_certs
